<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>中間試験</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;

            background-image: url("background.png");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: "Yu Mincho", "Hiragino Mincho ProN", serif;
        }

        .exam-paper {
            width: min(1100px, 92vw);
            min-height: 680px;
        
            background-image: url("paper.png");
            background-size: 100% 100%;
            background-position: center;
            background-repeat: no-repeat;
            background-color: transparent;
        
            padding: 50px 70px;
        
            box-shadow: none;
        
            box-sizing: border-box;
        }

        .exam-header {
            position: relative;
            text-align: center;

            margin-bottom: 50px;
        }

        .exam-title {
            font-size: 32px;
            letter-spacing: 12px;
            margin: 0;
        }

        .question-number {
            position: absolute;
            right: 0;
            top: 0;

            width: 42px;
            height: 42px;

            border: 2px solid black;
            border-radius: 50%;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 22px;
        }

        .question-area {
            width: 100%;
            min-height: 280px;

            display: flex;
            justify-content: center;
            align-items: center;

            margin-bottom: 40px;
        }

        .question-image {
            max-width: 100%;
            max-height: 400px;
            object-fit: contain;
        }

        .answer-row {
            display: flex;
            align-items: baseline;
            gap: 15px;
        }
        
        .answer-label {
            font-size: 16px;
            white-space: nowrap;
        }
        
        .answer-input {
            flex: 1;
        
            border: none;
            border-bottom: 1px solid #333;
        
            padding: 4px 5px;
        
            font-size: 20px;
            font-family: inherit;
        
            outline: none;
            background: transparent;
        
            box-sizing: border-box;
        }

        .submit-area {
            margin-top: 50px;
            text-align: right;
        }

        .submit-button {
            background: transparent;

            border: 1px solid #333;

            padding: 10px 35px;

            font-family: inherit;
            font-size: 22px;

            cursor: pointer;
        }

        .submit-button:hover {
            background: #f3f3f3;
        }

        .result-message {
            height: 24px;
            margin-top: 12px;
            font-size: 14px;
        }
        
        .result-message.correct {
            color: #222;
        }
        
        .result-message.incorrect {
            color: #8a2020;
        }
        
        .submit-button:disabled {
            opacity: 0.5;
            cursor: default;
        }

        .exam-paper.accepted-paper {
            width: 400px;
            min-height: 180px;
            padding: 30px;
        }
        
        .accepted-screen {
            min-height: 120px;
        
            display: flex;
            justify-content: center;
            align-items: center;
        
            font-size: 16px;
            letter-spacing: 2px;
        }
        .accepted-paper {
            transition: opacity 0.5s ease;
        }
        
        .accepted-paper.fade-out {
            opacity: 0;
        }
    </style>
</head>
    
<body>

    <main class="exam-paper">

        <header class="exam-header">

            <h1 class="exam-title">
                中間試験
            </h1>

            <div class="question-number">
                1
            </div>

        </header>


        <section class="question-area">

            <!-- 後でここに問題画像を表示します -->

            <p>
                ここに問題①の画像が表示されます
            </p>

        </section>


        <section class="answer-area">
        
            <div class="answer-row">
        
                <label class="answer-label">
                    解答
                </label>
        
                <input
                    class="answer-input"
                    type="text"
                    autocomplete="off"
                    spellcheck="false"
                >
        
            </div>
        
        </section>


        <div class="result-message" id="resultMessage"></div>
        
        <div class="submit-area">
        
            <button class="submit-button" id="submitButton">
                提出
            </button>
        
        </div>

    </main>

    
    <script>
        const answerInput = document.querySelector(".answer-input");
        const submitButton = document.getElementById("submitButton");
        const resultMessage = document.getElementById("resultMessage");
        const questionNumber = document.querySelector(".question-number");
    
        let currentQuestion = 1;
    
        submitButton.addEventListener("click", submitAnswer);
    
        answerInput.addEventListener("keydown", function(event) {
            if (event.key === "Enter") {
                submitAnswer();
            }
        });
    
        function submitAnswer() {
    
            const answer = answerInput.value.trim().toUpperCase();
    
            // 今はテスト用
            if (answer === "TEST") {
            
                const examPaper = document.querySelector(".exam-paper");
            
                examPaper.classList.add("accepted-paper");
            
                examPaper.innerHTML = `
                    <div class="accepted-screen">
                        解答を受理しました。
                    </div>
                `;
            
                // 2.5秒待ってからフェードアウト
                setTimeout(() => {
                    examPaper.classList.add("fade-out");
                }, 2500);
            
                // 合計3秒後に問題②へ
                setTimeout(() => {
                    showQuestion2();
                }, 3000);
            }
        }

        function showQuestion2() {
        
            const examPaper = document.querySelector(".exam-paper");
        
            examPaper.classList.remove("accepted-paper", "fade-out");
        
            examPaper.innerHTML = `
                <header class="exam-header">
        
                    <h1 class="exam-title">
                        中間試験
                    </h1>
        
                    <div class="question-number">
                        2
                    </div>
        
                </header>
        
                <section class="question-area">
        
                    <p>
                        ここに問題②の画像が表示されます
                    </p>
        
                </section>
        
                <section class="answer-area">
        
                    <div class="answer-row">
        
                        <label class="answer-label">
                            解答
                        </label>
        
                        <input
                            class="answer-input"
                            type="text"
                            autocomplete="off"
                            spellcheck="false"
                        >
        
                    </div>
        
                </section>
        
                <div class="result-message" id="resultMessage"></div>
        
                <div class="submit-area">
        
                    <button class="submit-button" id="submitButton">
                        提出
                    </button>
        
                </div>
            `;
        
        }
    </script>

</body>

</html>
